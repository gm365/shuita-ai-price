name: daily price snapshot

# 每天北京时间约 9:45（早上全量采集的构建上线之后）从 shuita.xyz/llms.txt 刷新 README 的行情快照表。
# 表格没变就不提交。
on:
  schedule:
    - cron: "45 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh snapshot
        run: node scripts/update-snapshot.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): daily price snapshot"
          git push
